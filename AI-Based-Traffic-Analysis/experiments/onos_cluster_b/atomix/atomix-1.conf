cluster {
  cluster-id: sdn-cluster-b
  node {
    id: atomix-1
    address: "atomix-1:5679"
  }
  discovery {
    type: bootstrap
    nodes.1 {
      id: atomix-1
      address: "atomix-1:5679"
    }
    nodes.2 {
      id: atomix-2
      address: "atomix-2:5679"
    }
    nodes.3 {
      id: atomix-3
      address: "atomix-3:5679"
    }
  }
}

management-group {
  type: raft
  partitions: 1
  storage.level: disk
  members: [atomix-1, atomix-2, atomix-3]
}

partition-groups.raft {
  type: raft
  partitions: 3
  storage.level: disk
  members: [atomix-1, atomix-2, atomix-3]
}
